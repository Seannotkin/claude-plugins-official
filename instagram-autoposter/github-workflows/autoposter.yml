# Copy to .github/workflows/autoposter.yml in the PRIVATE repository that holds this project
# (project files at the repository root). Scheduled workflows only run from the default branch.
name: autoposter
on:
  schedule:
    - cron: "*/10 * * * *"   # answer Telegram and make scheduled videos
  workflow_dispatch:
concurrency:
  group: autoposter
  cancel-in-progress: false
permissions:
  contents: write            # to save state/state.json
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: python -m autoposter tick
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - name: Save state
        if: always()
        run: |
          git config user.name "autoposter"
          git config user.email "autoposter@users.noreply.github.com"
          git add state/state.json 2>/dev/null || exit 0
          git diff --cached --quiet || (git commit -m "Update autoposter state" && git push)
