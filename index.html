<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#A9D3DD">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="היום שלי">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>היום שלי</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap">
<style>
  /* Concept: a forest. Every daily task is a tree that grows when it is done; dated tasks are
     stops along a trail. The sky follows the real time of day, so the palette is set by the
     clock (data-phase on the root) and not by the OS theme. Layout: a full-width scene on top,
     and the lists written straight on the forest floor below it. */
  :root {
    --sky-1: #8FC3D8; --sky-2: #EAF1DA;
    --on-sky: #1F3B30; --on-sky-soft: #3F6052;
    --hill-1: #A3C6AE; --hill-2: #6FA387; --hill-3: #3F7A63;
    --ground: #2B5A49; --on-ground: #EEF3E4; --on-ground-soft: #A9C4B3; --rule: #EEF3E424;
    --leaf: #8FD19A; --canopy: #3E8E5A; --canopy-light: #6DB07A; --pine: #2F6F57;
    --sprout: #B9E08F; --autumn: #D9A066; --trunk: #6B4A33;
    --orb: #FFF2C4; --bloom: #F3B6C4;
    --wood: #C9A27A; --wood-ring: #B48A60; --wood-ink: #3A2A1C;
    --accent: #F4C766; --on-accent: #24402F;
    --font-display: "Frank Ruhl Libre", "Times New Roman", serif;
    --font-body: "Assistant", "Arial Hebrew", system-ui, -apple-system, sans-serif;
  }
  :root[data-phase="dawn"] {
    --sky-1: #DFA9A6; --sky-2: #FBECD2; --on-sky: #2D3B38; --on-sky-soft: #55655F;
    --hill-1: #B9C9BC; --hill-2: #86A894; --hill-3: #4E8069; --ground: #2F5B4C; --orb: #FFE3B8;
  }
  :root[data-phase="dusk"] {
    --sky-1: #34437A; --sky-2: #F7B685; --on-sky: #F6F1E6; --on-sky-soft: #DADDEA;
    --hill-1: #6E86A0; --hill-2: #4A6E78; --hill-3: #2C5459; --ground: #1F4640; --orb: #FFD9A0;
    --canopy: #2F7350; --canopy-light: #4F9569; --pine: #245A49;
  }
  :root[data-phase="night"] {
    color-scheme: dark;
    --sky-1: #060F1B; --sky-2: #1C3A49; --on-sky: #E6EEF0; --on-sky-soft: #9FB5BE;
    --hill-1: #1E3F4C; --hill-2: #17323C; --hill-3: #10262E;
    --ground: #0E211F; --on-ground: #DCE8DF; --on-ground-soft: #84A193; --rule: #DCE8DF1F;
    --leaf: #6CC088; --canopy: #2C6B4A; --canopy-light: #3F8A5E; --pine: #1F5343;
    --sprout: #86B86A; --autumn: #B98B5B; --trunk: #4A3526;
    --orb: #F3F0DC; --bloom: #C995A6;
    --wood: #7A5E45; --wood-ring: #63493A; --wood-ink: #F1E6D6;
    --accent: #E7C36A; --on-accent: #1B2E25;
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--ground); color: var(--on-ground);
    font-family: var(--font-body); font-size: 17px; line-height: 1.45;
    -webkit-tap-highlight-color: transparent;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .gutter {
    max-width: 540px; margin-inline: auto;
    padding-left: max(18px, env(safe-area-inset-left, 0px));
    padding-right: max(18px, env(safe-area-inset-right, 0px));
  }

  /* The scene */
  .scene { position: relative; overflow: hidden; height: clamp(410px, 60vh, 560px); background: var(--sky-1); color: var(--on-sky); }
  .scene.short { height: clamp(330px, 44vh, 420px); }
  .scene .gutter { position: relative; z-index: 1; padding-block: 14px 0; }
  .land { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .tabs { display: flex; gap: 6px; }
  .tabs button {
    min-height: 44px; padding: 0 16px; background: none; border: 0; font-weight: 600;
    color: var(--on-sky-soft); border-radius: 22px 6px 22px 6px;
  }
  .tabs button[aria-selected="true"] { background: var(--on-sky); color: var(--sky-2); }
  .title { margin: 10px 0 0; font-family: var(--font-display); font-weight: 500; font-size: clamp(60px, 19vw, 84px); line-height: 1; }
  .sub { color: var(--on-sky-soft); display: flex; flex-wrap: wrap; gap: 2px 14px; }
  .sub b { color: var(--on-sky); font-weight: 600; }
  /* The forest floor */
  .floor .gutter { padding-block: 6px 56px; display: flex; flex-direction: column; gap: 22px; }
  .rows { list-style: none; margin: 0; padding: 0; }
  .row { display: flex; align-items: center; gap: 4px; min-height: 62px; border-bottom: 1px solid var(--rule); }
  .ic { flex: none; width: 46px; height: 48px; display: grid; place-items: center; background: none; border: 0; }
  .ic:active svg { transform: scale(.82); }
  .ic svg { width: 28px; height: 28px; fill: none; stroke: var(--on-ground-soft); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; transition: fill .3s, stroke .3s, transform .3s; }
  .ic.leaf[aria-pressed="true"] svg { fill: var(--leaf); stroke: var(--leaf); }
  .ic.leaf[aria-pressed="true"] svg .rib { stroke: var(--ground); }
  .ic.fall svg { width: 25px; height: 25px; opacity: .8; }
  .ic.fall[aria-pressed="true"] svg { fill: var(--autumn); stroke: var(--autumn); opacity: 1; transform: rotate(18deg) translateY(2px); }
  .ic.fall[aria-pressed="true"] svg .rib { stroke: var(--ground); }
  .txt {
    flex: 1; min-width: 0; text-align: start; background: none; border: 0; border-radius: 8px;
    padding: 9px 4px; min-height: 48px; font-size: 18px; overflow-wrap: anywhere;
    display: flex; flex-direction: column; justify-content: center;
  }
  .txt .tag { font-size: 13px; color: var(--on-ground-soft); font-variant-numeric: tabular-nums; }
  .row[data-state="done"] .t { color: var(--on-ground-soft); text-decoration: line-through; text-decoration-thickness: 1px; }
  .row[data-state="missed"] .t { color: var(--on-ground-soft); }
  .row[data-state="missed"] .tag { color: var(--autumn); }

  .fill {
    min-width: 0; height: 48px; padding: 0 2px; font-size: 18px; color: var(--on-ground);
    background: none; border: 0; border-bottom: 1.5px solid var(--on-ground-soft); border-radius: 0;
  }
  .fill::placeholder { color: var(--on-ground-soft); }
  select.fill { font-size: 16px; }
  select.fill option { color: initial; }
  .plant {
    height: 46px; padding: 0 20px; border: 0; flex: none; font-weight: 700;
    background: var(--accent); color: var(--on-accent); border-radius: 23px 6px 23px 6px;
  }
  .ghost { height: 42px; padding: 0 14px; background: none; border: 1.5px solid var(--on-ground-soft); border-radius: 21px 6px 21px 6px; font-weight: 600; font-size: 15px; }
  .ghost.warn { border-color: var(--autumn); color: var(--autumn); }
  .ghost.bare { border-color: transparent; color: var(--on-ground-soft); }
  .addline { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; }
  .addline .fill { flex: 1 1 55%; }
  .addline.week #newDated { flex-basis: 100%; }
  .addline.week select { flex: 1 1 120px; }
  .addline.week input[type="time"] { flex: 0 1 104px; font-size: 16px; }
  .edit { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 0 10px; }
  .edit .fill { flex: 1 1 100%; }

  .quiet { margin: 0; color: var(--on-ground-soft); }
  .label { margin: 0 0 -14px; font-size: 14px; font-weight: 600; color: var(--on-ground-soft); }
  .foot { margin: 0; font-size: 13px; color: var(--on-ground-soft); text-align: center; }
  .foot.warn { color: var(--autumn); font-weight: 600; }

  /* The trail */
  .trail { position: relative; display: flex; flex-direction: column; gap: 18px; }
  .trail::before { /* the path between the stumps */
    content: ""; position: absolute; inset-block: 24px 24px; inset-inline-start: 22px;
    border-inline-start: 3px dotted var(--on-ground-soft); opacity: .55;
  }
  .stop { position: relative; display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 12px; align-items: start; }
  .stump {
    width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
    background: var(--wood); color: var(--wood-ink);
    box-shadow: inset 0 0 0 3px var(--wood), inset 0 0 0 4.5px var(--wood-ring), inset 0 0 0 9px var(--wood), inset 0 0 0 10.5px var(--wood-ring), 0 0 0 4px var(--ground);
    font-family: var(--font-display); font-weight: 700; font-size: 19px; font-variant-numeric: tabular-nums;
  }
  .stop.today .stump { box-shadow: inset 0 0 0 3px var(--wood), inset 0 0 0 4.5px var(--wood-ring), inset 0 0 0 9px var(--wood), inset 0 0 0 10.5px var(--wood-ring), 0 0 0 4px var(--ground), 0 0 0 6.5px var(--accent); }
  .stop h2 { margin: 0; min-height: 46px; display: flex; align-items: center; flex-wrap: wrap; gap: 0 10px; font-size: 19px; font-weight: 700; }
  .stop h2 small { font-size: 14px; font-weight: 400; color: var(--on-ground-soft); }
  .stop.free h2 { font-weight: 400; color: var(--on-ground-soft); font-size: 17px; }
  .stop.free .stump { transform: scale(.72); opacity: .8; }
  .stop .row:last-child { border-bottom: 0; }

  .toast {
    position: fixed; inset-inline: 0; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    margin-inline: auto; width: max-content; max-width: calc(100% - 32px);
    display: flex; align-items: center; gap: 10px;
    background: var(--on-ground); color: var(--ground); padding-block: 6px; padding-inline: 18px 6px;
    border-radius: 24px 6px 24px 6px; font-size: 15px;
  }
  .toast button { background: none; border: 0; font-weight: 700; min-height: 40px; padding: 0 12px; text-decoration: underline; text-underline-offset: 3px; }
</style>

</head>
<body>
<div dir="rtl" lang="he">
  <header class="scene" id="scene">
    <canvas class="land" id="land" role="img" aria-label="יער שבו כל משימה היא עץ"></canvas>
    <div class="gutter">
      <div class="tabs" role="tablist" aria-label="עמודים">
        <button type="button" role="tab" id="tabDaily" aria-controls="viewDaily">היער · כל יום</button>
        <button type="button" role="tab" id="tabWeek" aria-controls="viewWeek">השביל · השבוע</button>
      </div>
      <h1 class="title" id="title"></h1>
      <div class="sub" id="sub" aria-live="polite"></div>
    </div>
  </header>

  <main class="floor">
    <!-- Page 1: the routine. One tree per task, grown fresh every day. -->
    <section class="gutter" id="viewDaily" role="tabpanel" aria-labelledby="tabDaily">
      <ul class="rows" id="routineList"></ul>
      <p class="quiet" id="routineEmpty" hidden>היער עוד ריק. שתול כאן משימה שחוזרת כל יום, והיא תנבוט מחדש בכל בוקר.</p>
      <form class="addline" id="addRoutine" autocomplete="off">
        <input class="fill" id="newRoutine" type="text" placeholder="משימה לכל יום…" aria-label="משימה חדשה לכל יום" maxlength="200" enterkeyhint="done">
        <button class="plant" type="submit">שתול</button>
      </form>
      <p class="label" id="todayLabel" hidden>על השביל היום</p>
      <ul class="rows" id="todayList" hidden></ul>
      <p class="foot" id="footDaily"></p>
    </section>

    <!-- Page 2: dated tasks, as stops along the next seven days of trail. -->
    <section class="gutter" id="viewWeek" role="tabpanel" aria-labelledby="tabWeek" hidden>
      <form class="addline week" id="addDated" autocomplete="off">
        <input class="fill" id="newDated" type="text" placeholder="מה מחכה בהמשך השביל? למשל תור לרופא…" aria-label="משימה חדשה לשבוע" maxlength="200" enterkeyhint="done">
        <select class="fill" id="datedDay" aria-label="באיזה יום"></select>
        <input class="fill" id="datedTime" type="time" aria-label="שעה, לא חובה">
        <button class="plant" type="submit">הוסף</button>
      </form>
      <div class="trail" id="days"></div>
      <p class="foot" id="footWeek"></p>
    </section>
  </main>
</div>

<div class="toast" id="toast" dir="rtl" hidden>
  <span>המשימה נעקרה</span>
  <button type="button" id="undo">החזר</button>
</div>

<script>
(function () {
  document.documentElement.lang = 'he';
  document.documentElement.dir = 'rtl';

  var KEY = 'hayom-sheli.v2', OLD_KEY = 'hayom-sheli.v1';
  var storageOK = true;
  var $ = function (id) { return document.getElementById(id); };

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fromIso(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function shift(s, n) { var d = fromIso(s); d.setDate(d.getDate() + n); return iso(d); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  var WEEKDAYS = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
  function wd(day) { return WEEKDAYS[fromIso(day).getDay()]; }
  function dayMonth(day) { return fromIso(day).toLocaleDateString('he-IL', { day: 'numeric', month: 'long' }); }

  // routine: tasks that repeat every day. marks: what was ticked on each date.
  // dated: one-off tasks kept under the date they belong to.
  function blank() { return { routine: [], marks: {}, dated: {} }; }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && d.routine && d.marks && d.dated) return d;
      }
      var old = localStorage.getItem(OLD_KEY);
      if (old) {
        // Tasks from the first version were tied to a date, so they become dated tasks.
        var o = JSON.parse(old), fresh = blank();
        Object.keys((o && o.days) || {}).forEach(function (k) {
          var keep = o.days[k].filter(function (t) { return !t.example; }).map(function (t) {
            return { id: t.id, text: t.text, time: '', state: t.state || 'open' };
          });
          if (keep.length) fresh.dated[k] = keep;
        });
        return fresh;
      }
    } catch (e) { storageOK = false; }
    return blank();
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(db)); storageOK = true; }
    catch (e) { storageOK = false; }
  }

  var today = iso(new Date());
  var view = location.hash === '#week' ? 'week' : 'daily';
  var editing = null;
  var justId = null; // the task marked a moment ago, so its tree can grow in
  var undoFn = null, toastTimer = null;
  var db = load();

  // Old daily marks are only history; keep two months of them.
  (function prune() {
    var limit = shift(today, -60);
    Object.keys(db.marks).forEach(function (k) { if (k < limit) delete db.marks[k]; });
  })();

  // The sky follows the clock. A dark OS theme (or the viewer's dark toggle) always gets the night forest.
  var darkQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function setPhase() {
    var now = new Date(), h = now.getHours() + now.getMinutes() / 60;
    var phase = h < 5.5 || h >= 19 ? 'night' : h < 9 ? 'dawn' : h < 16 ? 'day' : 'dusk';
    var forced = document.documentElement.getAttribute('data-theme');
    if (forced === 'dark' || (!forced && darkQuery && darkQuery.matches)) phase = 'night';
    else if (forced === 'light' && phase === 'night') phase = 'day';
    if (document.documentElement.getAttribute('data-phase') !== phase) { document.documentElement.setAttribute('data-phase', phase); invalidateScene(); }
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', getComputedStyle(document.documentElement).getPropertyValue('--sky-1').trim());
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  var LEAF = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20C4 10 10 4 20 4c0 10-6 16-16 16Z"/><path class="rib" d="M4 20l9.5-9.5"/></svg>';
  var FALL = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 17c-1-7 3-12 12-13 1 9-4 14-12 13Z"/><path class="rib" d="M5 17l7-7"/><path d="M14 21h6M17 18.5h4"/></svg>';

  function routineState(id) { return (db.marks[today] || {})[id] || 'open'; }
  function setRoutineState(id, s) {
    var m = db.marks[today] || (db.marks[today] = {});
    if (s === 'open') delete m[id]; else m[id] = s;
  }
  function datedOf(day) {
    return (db.dated[day] || []).slice().sort(function (a, b) {
      return (a.time || '99:99') < (b.time || '99:99') ? -1 : (a.time || '99:99') > (b.time || '99:99') ? 1 : 0;
    });
  }

  function showToast(restore) {
    undoFn = restore;
    $('toast').hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $('toast').hidden = true; undoFn = null; }, 5000);
  }
  $('undo').onclick = function () {
    if (!undoFn) return;
    undoFn(); undoFn = null; clearTimeout(toastTimer); $('toast').hidden = true;
    save(); render();
  };

  /* ---------- the scene ---------- */
  // A living forest drawn on a canvas: misty layers of pines behind, and in front one
  // procedurally grown tree per daily task. Trees grow branch by branch when a task is
  // done and shed their leaves when it is marked as not done.

  function hash(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }
  function rng(seed) {
    return function () {
      seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function rgbOf(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function mix(a, b, t) { var A = rgbOf(a), B = rgbOf(b); return 'rgb(' + Math.round(A[0] + (B[0] - A[0]) * t) + ',' + Math.round(A[1] + (B[1] - A[1]) * t) + ',' + Math.round(A[2] + (B[2] - A[2]) * t) + ')'; }
  function rgba(h, a) { var A = rgbOf(h); return 'rgba(' + A[0] + ',' + A[1] + ',' + A[2] + ',' + a + ')'; }

  var GREENS = ['#276B47', '#35875A', '#58A868', '#93CF7C'], AUTUMN = ['#B5582A', '#D07A32', '#E2A148', '#EFC467'];
  var PAL = {
    day: { sky: ['#8FC3D8', '#C4E0DE', '#EAF1DA'], fog: '#E3EEDD', deep: '#2A6652', ground: '#2B5A49', grass: '#4E9A63', orb: '#FFF8DC', trunk: '#5B4030', greens: GREENS, autumn: AUTUMN, mote: '#FFFBE0', path: '#C9B68A', wood: '#B98F63' },
    dawn: { sky: ['#DFA9A6', '#F4CDB4', '#FBECD2'], fog: '#F8E6D2', deep: '#35685A', ground: '#2F5B4C', grass: '#5B9A68', orb: '#FFE7BD', trunk: '#5B4030', greens: GREENS, autumn: AUTUMN, mote: '#FFF1D0', path: '#CDB590', wood: '#B98F63' },
    dusk: { sky: ['#34437A', '#A9708F', '#F7B685'], fog: '#E0A08C', deep: '#1F4347', ground: '#1F4640', grass: '#3C7A5C', orb: '#FFD6A0', trunk: '#4A3327', greens: ['#1F5A42', '#2B7350', '#448F5E', '#74B470'], autumn: AUTUMN, mote: '#FFD9A8', path: '#A98F78', wood: '#9A7654' },
    night: { sky: ['#060F1B', '#0E2233', '#1C3A49'], fog: '#1E3F4B', deep: '#0A1E24', ground: '#0E211F', grass: '#1F4A3A', orb: '#F2EFDD', trunk: '#2E221A', greens: ['#174935', '#215E43', '#2F7852', '#4B9566'], autumn: ['#6E3C22', '#8A5429', '#A3733A', '#B98F52'], mote: '#F4E58A', path: '#3C4A45', wood: '#5F4936' }
  };
  var PETALS = ['#F6C1CF', '#FFF3E0', '#F7D774', '#CDB8F0'];
  function pal() { return PAL[document.documentElement.getAttribute('data-phase')] || PAL.day; }
  function phase() { return document.documentElement.getAttribute('data-phase') || 'day'; }

  var cv = $('land'), cx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1, bg = null, glow = null, glowFor = '';
  var trees = {}, order = [], flowers = {}, florder = [], sparks = [], motes = [], blades = [], stars = [], trail = [];
  var firstSync = true, running = false, lastT = 0;
  var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function invalidateScene() { bg = null; glow = null; if (still) requestAnimationFrame(frame); }
  function groundY(x) { return H * 0.8 + Math.sin(x / W * 3.3 + 0.8) * H * 0.012; }
  function orbPos() {
    var p = phase();
    return p === 'dawn' ? [W * 0.2, H * 0.46] : p === 'dusk' ? [W * 0.2, H * 0.5] : [W * 0.23, H * 0.24];
  }

        T.x = W * (0.07 + 0.86 * (col + 0.5) / count) + ((h % 100) / 100 - 0.5) * W * 0.03 + (isBack ? W * 0.03 : 0);
        T.y = groundY(T.x) + H * (two ? (isBack ? 0.008 : 0.06) : 0.035);
        T.S = H * 0.37 * Math.max(0.56, Math.min(1, 1.2 - count * 0.085)) * (0.9 + (h % 20) / 100) * (isBack ? 0.82 : 1);
        if (st === 'done' && T.state !== 'done' && !firstSync) for (var k = 0; k < 16; k++) sparks.push({ x: T.x + (Math.random() - 0.5) * T.S * 0.4, y: T.y - Math.random() * T.S * 0.3, vx: (Math.random() - 0.5) * 14, vy: -(18 + Math.random() * 34), life: 0.6 + Math.random() * 0.4, r: Math.random(), ph: Math.random() * 6 });
        T.state = st;
        if (T.fresh) { T.u = st === 'done' ? D + 1.6 : st === 'missed' ? D + 1.45 : 0.62; T.f = st === 'missed' ? 1 : 0; T.fresh = false; }
        seen[task.id] = 1; order.push(T);
      });
      if (two) order.sort(function (a, b) { return a.y - b.y; });
    }
    Object.keys(trees).forEach(function (id) { if (!db.routine.some(function (t) { return t.id === id; })) delete trees[id]; });

    florder = [];
    if (view === 'daily') {
      var due = datedOf(today);
      due.forEach(function (task, j) {
        var F = flowers[task.id];
        if (!F) { var r = rng(hash(task.id)); F = flowers[task.id] = { ph: r() * 6.28, col: PETALS[Math.floor(r() * PETALS.length)], b: 0, dr: 0, off: (r() - 0.5) * 0.05 }; if (firstSync) { F.b = task.state === 'done' ? 1 : 0.1; F.dr = task.state === 'missed' ? 1 : 0; } }
        F.state = task.state || 'open';
        F.x = W * (0.1 + 0.8 * (j + 0.5) / due.length + F.off); F.y = H * 0.975;
        florder.push(F);
      });
    }
    firstSync = false;
    wake();
  }
  window.addEventListener('resize', function () { if (fit()) syncScene(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) wake(); });

  /* ---------- rows ---------- */

  // One task line. o: {id, text, tag, state, onState(s), onText(v), onDelete()}
  function row(o) {
    var li = el('li', 'row'); li.dataset.state = o.state;
    if (editing === o.id) {
      var form = el('form', 'edit');
      var inp = el('input', 'fill'); inp.type = 'text'; inp.value = o.text; inp.maxLength = 200;
      inp.id = 'edit-' + o.id; inp.setAttribute('aria-label', 'עריכת משימה');
      var ok = el('button', 'plant', 'שמור'); ok.type = 'submit'; ok.style.height = '42px';
      var del = el('button', 'ghost warn', 'עקור'); del.type = 'button'; del.setAttribute('aria-label', 'מחק את המשימה');
      var cancel = el('button', 'ghost bare', 'ביטול'); cancel.type = 'button';
      form.onsubmit = function (e) {
        e.preventDefault();
        var v = inp.value.trim();
        if (v) { o.onText(v); save(); }
        editing = null; render();
      };
      del.onclick = function () { editing = null; showToast(o.onDelete()); save(); render(); };
      cancel.onclick = function () { editing = null; render(); };
      form.appendChild(inp); form.appendChild(ok); form.appendChild(del); form.appendChild(cancel);
      li.appendChild(form);
      setTimeout(function () { inp.focus(); }, 0);
      return li;
    }
    function mark(target) {
      var next = o.state === target ? 'open' : target;
      justId = next === 'done' ? o.id : null;
      o.onState(next); save(); render();
    }
    var leaf = el('button', 'ic leaf'); leaf.type = 'button'; leaf.innerHTML = LEAF;
    leaf.setAttribute('aria-label', 'עשיתי'); leaf.setAttribute('aria-pressed', String(o.state === 'done'));
    leaf.onclick = function () { mark('done'); };

    var txt = el('button', 'txt'); txt.type = 'button';
    txt.setAttribute('aria-label', 'ערוך: ' + o.text);
    txt.appendChild(el('span', 't', o.text));
    var tag = [o.tag, o.state === 'missed' ? 'לא היום' : ''].filter(Boolean).join(' · ');
    if (tag) txt.appendChild(el('span', 'tag', tag));
    txt.onclick = function () { editing = o.id; render(); };

    var fall = el('button', 'ic fall'); fall.type = 'button'; fall.innerHTML = FALL;
    fall.setAttribute('aria-label', 'לא עשיתי'); fall.setAttribute('aria-pressed', String(o.state === 'missed'));
    fall.onclick = function () { mark('missed'); };

    li.appendChild(leaf); li.appendChild(txt); li.appendChild(fall);
    return li;
  }

  function routineRow(t) {
    return row({
      id: t.id, text: t.text, state: routineState(t.id), tag: '',
      onState: function (s) { setRoutineState(t.id, s); },
      onText: function (v) { t.text = v; },
      onDelete: function () {
        var at = db.routine.indexOf(t);
        db.routine.splice(at, 1);
        return function () { db.routine.splice(Math.min(at, db.routine.length), 0, t); };
      }
    });
  }
  function datedRow(t, day) {
    return row({
      id: t.id, text: t.text, state: t.state || 'open', tag: t.time || '',
      onState: function (s) { t.state = s; },
      onText: function (v) { t.text = v; },
      onDelete: function () {
        var arr = db.dated[day], at = arr.indexOf(t);
        arr.splice(at, 1);
        if (!arr.length) delete db.dated[day];
        return function () {
          var a = db.dated[day] || (db.dated[day] = []);
          a.splice(Math.min(at, a.length), 0, t);
        };
      }
    });
  }

  /* ---------- pages ---------- */

  function setSub(parts) {
    var sub = $('sub'); sub.textContent = '';
    parts.forEach(function (p) { sub.appendChild(p.strong ? el('b', '', p.text) : el('span', '', p.text)); });
  }

  function renderDaily() {
    $('title').textContent = wd(today);
    var states = db.routine.map(function (t) { return routineState(t.id); });
    var done = states.filter(function (s) { return s === 'done'; }).length;
    setSub([
      { text: fromIso(today).toLocaleDateString('he-IL', { day: 'numeric', month: 'long', year: 'numeric' }) },
      { strong: true, text: !states.length ? 'היער מחכה לעץ הראשון' : done === states.length ? 'כל היער צמח היום' : done + ' מתוך ' + states.length + ' עצים צמחו היום' }
    ]);

    var list = $('routineList'); list.textContent = '';
    db.routine.forEach(function (t) { list.appendChild(routineRow(t)); });
    list.hidden = db.routine.length === 0;
    $('routineEmpty').hidden = db.routine.length > 0;

    var todays = datedOf(today);
    $('todayLabel').hidden = $('todayList').hidden = todays.length === 0;
    var tl = $('todayList'); tl.textContent = '';
    todays.forEach(function (t) { tl.appendChild(datedRow(t, today)); });
  }

  function renderWeek() {
    $('title').textContent = 'השביל';
    var count = 0;
    for (var c = 0; c < 7; c++) count += datedOf(shift(today, c)).length;
    setSub([
      { text: dayMonth(today) + ' עד ' + dayMonth(shift(today, 6)) },
      { strong: true, text: count === 0 ? 'שבוע פתוח לגמרי' : count === 1 ? 'עצירה אחת בדרך' : count + ' עצירות בדרך' }
    ]);

    var sel = $('datedDay'), chosen = sel.value;
    sel.textContent = '';
    for (var i = 0; i < 7; i++) {
      var day = shift(today, i), d = fromIso(day);
      var opt = el('option', '', (i === 0 ? 'היום' : i === 1 ? 'מחר' : 'יום ' + wd(day)) + ' · ' + d.getDate() + '.' + (d.getMonth() + 1));
      opt.value = day;
      sel.appendChild(opt);
    }
    if (chosen >= today && chosen <= shift(today, 6)) sel.value = chosen;

    var days = $('days'); days.textContent = '';
    for (var j = 0; j < 7; j++) {
      (function (day, n) {
        var tasks = datedOf(day);
        var stop = el('section', 'stop' + (n === 0 ? ' today' : '') + (tasks.length ? '' : ' free'));
        stop.appendChild(el('div', 'stump', fromIso(day).getDate()));
        var body = el('div');
        var h = el('h2');
        h.appendChild(document.createTextNode(n === 0 ? 'היום' : n === 1 ? 'מחר' : 'יום ' + wd(day)));
        h.appendChild(el('small', '', (n < 2 ? 'יום ' + wd(day) + ' · ' : '') + (tasks.length ? dayMonth(day) : 'שביל פתוח')));
        body.appendChild(h);
        if (tasks.length) {
          var ul = el('ul', 'rows');
          tasks.forEach(function (t) { ul.appendChild(datedRow(t, day)); });
          body.appendChild(ul);
        }
        stop.appendChild(body);
        days.appendChild(stop);
      })(shift(today, j), j);
    }
  }

  function render() {
    $('viewDaily').hidden = view !== 'daily';
    $('viewWeek').hidden = view !== 'week';
    $('tabDaily').setAttribute('aria-selected', String(view === 'daily'));
    $('tabWeek').setAttribute('aria-selected', String(view === 'week'));
    if (view === 'daily') renderDaily(); else renderWeek();
    syncScene();
    justId = null;

    var warn = 'הדפדפן הזה חוסם שמירה, ולכן המשימות יימחקו ביציאה. נסה לפתוח בדפדפן רגיל, לא במצב פרטי.';
    $('footDaily').className = $('footWeek').className = 'foot' + (storageOK ? '' : ' warn');
    $('footDaily').textContent = storageOK ? 'עלה ירוק = עשיתי, עלה נושר = לא היום. כל בוקר היער מתחיל מחדש מנבטים. לחיצה על משימה פותחת עריכה.' : warn;
    $('footWeek').textContent = storageOK ? 'מה שמגיע היום פורח גם בעמוד היער. הכול נשמר אוטומטית במכשיר הזה.' : warn;
  }

  function go(v) {
    view = v; editing = null;
    try { history.replaceState(null, '', v === 'week' ? '#week' : '#daily'); } catch (e) {}
    render();
    window.scrollTo(0, 0);
  }
  $('tabDaily').onclick = function () { go('daily'); };
  $('tabWeek').onclick = function () { go('week'); };

  $('addRoutine').addEventListener('submit', function (e) {
    e.preventDefault();
    var inp = $('newRoutine'), v = inp.value.trim();
    if (!v) { inp.focus(); return; }
    var t = { id: uid(), text: v };
    db.routine.push(t); justId = t.id;
    inp.value = ''; save(); render(); inp.focus();
  });

  $('addDated').addEventListener('submit', function (e) {
    e.preventDefault();
    var inp = $('newDated'), v = inp.value.trim();
    if (!v) { inp.focus(); return; }
    var day = $('datedDay').value || today;
    (db.dated[day] || (db.dated[day] = [])).push({ id: uid(), text: v, time: $('datedTime').value || '', state: 'open' });
    inp.value = ''; $('datedTime').value = '';
    save(); render(); inp.focus();
  });

  // A new day (or a new time of day) arrived while the page was in the background.
  function refresh() {
    setPhase();
    var now = iso(new Date());
    if (now !== today) { today = now; editing = null; render(); }
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(); });
  window.addEventListener('focus', refresh);
  setInterval(refresh, 5 * 60 * 1000);
  if (darkQuery && darkQuery.addEventListener) darkQuery.addEventListener('change', setPhase);
  if (window.MutationObserver) new MutationObserver(setPhase).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  setPhase();
  render();
})();
</script>
</body>
