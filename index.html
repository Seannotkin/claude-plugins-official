<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF2EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1917" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="היום שלי">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>היום שלי</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Karantina:wght@400;700&display=swap">
<style>
  /* Layout: one narrow column for the thumb. Big day name, a week strip to move between days,
     a progress bar with one segment per task, then the list. */
  :root {
    --bg: #EDF2EE;
    --surface: #FBFDFB;
    --ink: #15302A;
    --muted: #5A6F68;
    --line: #D2DDD7;
    --done: #1C7556;
    --done-bg: #DCEFE5;
    --miss: #AE4C39;
    --miss-bg: #F6E1DA;
    --accent: #E2A12F;
    --on-accent: #15302A;
    --font-display: "Karantina", "Assistant", "Arial Hebrew", system-ui, sans-serif;
    --font-body: "Assistant", "Arial Hebrew", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1917; --surface: #162522; --ink: #E6EFEA; --muted: #8FA69E; --line: #2A3F3A;
      --done: #5CC79E; --done-bg: #173A2F; --miss: #E58B76; --miss-bg: #40231D;
      --accent: #F0B548; --on-accent: #0E1917; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1917; --surface: #162522; --ink: #E6EFEA; --muted: #8FA69E; --line: #2A3F3A;
    --done: #5CC79E; --done-bg: #173A2F; --miss: #E58B76; --miss-bg: #40231D;
    --accent: #F0B548; --on-accent: #0E1917; color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.45;
    -webkit-tap-highlight-color: transparent;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap {
    max-width: 540px;
    margin-inline: auto;
    padding-block: 20px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Header */
  .head { display: flex; flex-direction: column; gap: 2px; }
  .rel {
    font-weight: 700; font-size: 14px; color: var(--muted);
    display: flex; align-items: center; gap: 8px; min-height: 20px;
  }
  .rel .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .dayname {
    font-family: var(--font-display); font-weight: 700;
    font-size: clamp(64px, 21vw, 96px); line-height: .9; margin: 0; letter-spacing: .01em;
  }
  .date { color: var(--muted); font-size: 16px; }

  /* Week strip */
  .strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .chip {
    border: 1px solid transparent; background: none; border-radius: 12px;
    padding: 8px 2px 8px; min-height: 60px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .chip .wd { font-size: 13px; color: var(--muted); }
  .chip .num { font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .chip .bar { width: 22px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 4px; }
  .chip .bar i { display: block; height: 100%; background: var(--done); border-radius: 2px; }
  .chip.today .wd { color: var(--ink); font-weight: 700; }
  .chip.today .num { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 3px; text-underline-offset: 4px; }
  .chip.sel { background: var(--surface); border-color: var(--line); }

  /* Progress */
  .progress { display: flex; flex-direction: column; gap: 8px; }
  .segs { display: flex; gap: 4px; height: 10px; }
  .segs span { flex: 1; border-radius: 5px; background: var(--line); transition: background .25s; }
  .segs span.done { background: var(--done); }
  .segs span.missed { background: var(--miss); }
  .sum { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 15px; color: var(--muted); }
  .sum b { color: var(--ink); font-variant-numeric: tabular-nums; }

  /* Add */
  .add { display: flex; gap: 8px; }
  .add input {
    flex: 1; min-width: 0; height: 52px; padding: 0 16px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; font-size: 17px;
  }
  .add input::placeholder { color: var(--muted); }
  .add button {
    height: 52px; padding: 0 20px; border: 0; border-radius: 14px;
    background: var(--accent); color: var(--on-accent); font-weight: 700;
  }

  /* Banners */
  .banner {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
    padding: 12px 14px; border: 1px dashed var(--line); border-radius: 14px; font-size: 15px;
  }
  .banner p { margin: 0; flex: 1 1 180px; min-width: 0; }
  .banner .acts { display: flex; gap: 8px; }
  .btn {
    min-height: 40px; padding: 0 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 15px;
  }
  .btn.quiet { background: none; border-color: transparent; color: var(--muted); }
  .btn.danger { color: var(--miss); }

  /* List */
  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .task {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 6px 6px 6px 8px; padding-inline-start: 6px; padding-inline-end: 8px;
    transition: background .2s, border-color .2s;
  }
  .task .txt {
    flex: 1; min-width: 0; text-align: start; background: none; border: 0;
    padding: 10px 10px; min-height: 48px; border-radius: 10px;
    overflow-wrap: anywhere; display: flex; flex-direction: column; justify-content: center; gap: 2px;
  }
  .task .tag { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
  .marks { display: flex; gap: 6px; flex: none; }
  .mk {
    width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid var(--line);
    background: none; display: grid; place-items: center; color: var(--muted);
    transition: background .15s, color .15s, border-color .15s, transform .15s;
  }
  .mk svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .mk:active { transform: scale(.92); }
  .mk.yes[aria-pressed="true"] { background: var(--done); border-color: var(--done); color: var(--surface); }
  .mk.no[aria-pressed="true"] { background: var(--miss); border-color: var(--miss); color: var(--surface); }
  .task[data-state="done"] { background: var(--done-bg); border-color: transparent; }
  .task[data-state="done"] .txt .t { text-decoration: line-through; text-decoration-thickness: 1.5px; color: var(--muted); }
  .task[data-state="missed"] { background: var(--miss-bg); border-color: transparent; }
  .task[data-state="missed"] .tag { color: var(--miss); }

  .edit { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 8px; padding: 4px; }
  .edit input {
    flex: 1 1 100%; min-width: 0; height: 46px; padding: 0 12px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  }

  .empty { text-align: center; color: var(--muted); padding: 28px 12px; border: 1px dashed var(--line); border-radius: 16px; }
  .empty strong { display: block; color: var(--ink); font-family: var(--font-display); font-size: 34px; font-weight: 400; line-height: 1.1; }

  .foot { font-size: 13px; color: var(--muted); text-align: center; }
  .foot.warn { color: var(--miss); font-weight: 600; }

  .toast {
    position: fixed; inset-inline: 0; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    margin-inline: auto; width: max-content; max-width: calc(100% - 32px);
    display: flex; align-items: center; gap: 12px;
    background: var(--ink); color: var(--bg); padding: 8px 8px 8px 16px; padding-inline: 16px 8px;
    border-radius: 14px; font-size: 15px;
  }
  .toast button { background: none; border: 0; color: var(--accent); font-weight: 700; min-height: 36px; padding: 0 10px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>
<body>
<div class="wrap" dir="rtl" lang="he">
  <header class="head">
    <div class="rel" id="rel"></div>
    <h1 class="dayname" id="dayname"></h1>
    <div class="date" id="date"></div>
  </header>

  <nav class="strip" id="strip" aria-label="מעבר בין ימים"></nav>

  <section class="progress" aria-live="polite">
    <div class="segs" id="segs"></div>
    <div class="sum" id="sum"></div>
  </section>

  <form class="add" id="addForm" autocomplete="off">
    <input id="newTask" type="text" placeholder="משימה חדשה…" aria-label="משימה חדשה" maxlength="200" enterkeyhint="done">
    <button type="submit">הוסף</button>
  </form>

  <div class="banner" id="exampleBanner" hidden>
    <p>אלה משימות לדוגמה, כדי שתראה איך זה עובד.</p>
    <div class="acts"><button class="btn" id="clearExamples" type="button">נקה והתחל</button></div>
  </div>

  <div class="banner" id="carryBanner" hidden>
    <p id="carryText"></p>
    <div class="acts">
      <button class="btn" id="carryYes" type="button">העבר להיום</button>
      <button class="btn quiet" id="carryNo" type="button">לא צריך</button>
    </div>
  </div>

  <ul class="list" id="list"></ul>
  <div class="empty" id="empty" hidden></div>

  <p class="foot" id="foot"></p>
</div>

<div class="toast" id="toast" dir="rtl" hidden>
  <span>המשימה נמחקה</span>
  <button type="button" id="undo">בטל</button>
</div>

<script>
(function () {
  document.documentElement.lang = 'he';
  document.documentElement.dir = 'rtl';

  var KEY = 'hayom-sheli.v1';
  var storageOK = true;
  var $ = function (id) { return document.getElementById(id); };

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fromIso(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function shift(s, n) { var d = fromIso(s); d.setDate(d.getDate() + n); return iso(d); }
  function diffDays(a, b) { return Math.round((fromIso(a) - fromIso(b)) / 864e5); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      var data = raw ? JSON.parse(raw) : null;
      return data && data.days ? data : null;
    } catch (e) { storageOK = false; return null; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(db)); storageOK = true; }
    catch (e) { storageOK = false; }
  }

  var today = iso(new Date());
  var sel = today;
  var editing = null;
  var lastDeleted = null, toastTimer = null;

  var db = load();
  if (!db) {
    db = { days: {} };
    db.days[today] = [
      { id: uid(), text: 'לשתות 2 ליטר מים', state: 'done', example: true },
      { id: uid(), text: 'לסיים את המצגת לעבודה', state: 'open', example: true },
      { id: uid(), text: '20 דקות הליכה בערב', state: 'open', example: true }
    ];
    save();
  }

  function tasksOf(day) { return db.days[day] || []; }
  function stats(day) {
    var t = tasksOf(day), done = 0, missed = 0;
    t.forEach(function (x) { if (x.state === 'done') done++; else if (x.state === 'missed') missed++; });
    return { total: t.length, done: done, missed: missed };
  }

  var WD = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'];
  function relLabel(day) {
    var d = diffDays(day, today);
    return d === 0 ? 'היום' : d === -1 ? 'אתמול' : d === 1 ? 'מחר' : d === -2 ? 'שלשום' : d < 0 ? 'לפני ' + (-d) + ' ימים' : 'בעוד ' + d + ' ימים';
  }
  function weekdayName(day) { return fromIso(day).toLocaleDateString('he-IL', { weekday: 'long' }); }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  var ICON = {
    yes: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    no: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>'
  };

  // The most recent earlier day that still has unfinished tasks to offer.
  function leftovers() {
    for (var i = 1; i <= 30; i++) {
      var day = shift(today, -i), t = tasksOf(day);
      if (!t.length) continue;
      var rest = t.filter(function (x) { return x.state !== 'done' && !x.carried && !x.example; });
      return { day: day, tasks: rest };
    }
    return { day: null, tasks: [] };
  }

  function render() {
    var d = fromIso(sel);
    var rel = $('rel'); rel.textContent = '';
    if (sel === today) rel.appendChild(el('span', 'dot'));
    rel.appendChild(document.createTextNode(relLabel(sel)));
    $('dayname').textContent = weekdayName(sel);
    $('date').textContent = d.toLocaleDateString('he-IL', { day: 'numeric', month: 'long', year: 'numeric' });

    // Week strip: five days back, today, tomorrow.
    var strip = $('strip'); strip.textContent = '';
    for (var o = -5; o <= 1; o++) {
      (function (day) {
        var s = stats(day), dd = fromIso(day);
        var b = el('button', 'chip' + (day === today ? ' today' : '') + (day === sel ? ' sel' : ''));
        b.type = 'button';
        b.setAttribute('aria-label', weekdayName(day) + ', ' + relLabel(day) + (s.total ? ', בוצעו ' + s.done + ' מתוך ' + s.total : ''));
        if (day === sel) b.setAttribute('aria-current', 'date');
        b.appendChild(el('span', 'wd', WD[dd.getDay()]));
        b.appendChild(el('span', 'num', dd.getDate()));
        var bar = el('span', 'bar'), fill = el('i');
        fill.style.width = (s.total ? Math.round(s.done / s.total * 100) : 0) + '%';
        bar.appendChild(fill); b.appendChild(bar);
        b.onclick = function () { sel = day; editing = null; render(); };
        strip.appendChild(b);
      })(shift(today, o));
    }

    // Progress
    var tasks = tasksOf(sel), st = stats(sel);
    var segs = $('segs'); segs.textContent = '';
    if (!tasks.length) segs.appendChild(el('span'));
    tasks.forEach(function (t) { segs.appendChild(el('span', t.state === 'open' ? '' : t.state)); });
    var sum = $('sum'); sum.textContent = '';
    if (tasks.length) {
      var a = el('span'); a.appendChild(document.createTextNode('בוצעו '));
      a.appendChild(el('b', '', st.done + ' מתוך ' + st.total));
      sum.appendChild(a);
      var open = st.total - st.done - st.missed;
      var right = st.done === st.total ? 'הכול בוצע. כל הכבוד!' :
        [open ? open + ' פתוחות' : '', st.missed ? st.missed + ' לא בוצעו' : ''].filter(Boolean).join(' · ');
      sum.appendChild(el('span', '', right));
    } else {
      sum.appendChild(el('span', '', 'אין עדיין משימות ליום הזה'));
    }

    // Banners
    $('exampleBanner').hidden = !tasks.some(function (t) { return t.example; });
    var lo = leftovers();
    var showCarry = sel === today && lo.tasks.length > 0;
    $('carryBanner').hidden = !showCarry;
    if (showCarry) {
      var from = lo.day === shift(today, -1) ? 'אתמול' : weekdayName(lo.day);
      $('carryText').textContent = lo.tasks.length === 1
        ? 'נשארה משימה אחת לא גמורה מ' + from + '.'
        : 'נשארו ' + lo.tasks.length + ' משימות לא גמורות מ' + from + '.';
    }

    // List
    var list = $('list'); list.textContent = '';
    tasks.forEach(function (t) {
      var li = el('li', 'task'); li.dataset.state = t.state;
      if (editing === t.id) {
        var form = el('form', 'edit');
        var inp = el('input'); inp.type = 'text'; inp.value = t.text; inp.maxLength = 200;
        inp.id = 'edit-' + t.id; inp.setAttribute('aria-label', 'עריכת משימה');
        var ok = el('button', 'btn', 'שמור'); ok.type = 'submit';
        var del = el('button', 'btn danger', 'מחק'); del.type = 'button';
        var cancel = el('button', 'btn quiet', 'ביטול'); cancel.type = 'button';
        form.onsubmit = function (e) {
          e.preventDefault();
          var v = inp.value.trim();
          if (v) { t.text = v; delete t.example; save(); }
          editing = null; render();
        };
        del.onclick = function () { removeTask(t.id); };
        cancel.onclick = function () { editing = null; render(); };
        form.appendChild(inp); form.appendChild(ok); form.appendChild(del); form.appendChild(cancel);
        li.appendChild(form);
        list.appendChild(li);
        setTimeout(function () { inp.focus(); }, 0);
        return;
      }
      var txt = el('button', 'txt'); txt.type = 'button';
      txt.setAttribute('aria-label', 'ערוך: ' + t.text);
      txt.appendChild(el('span', 't', t.text));
      var tag = t.state === 'missed' ? 'לא בוצע' : t.example ? 'דוגמה' : t.from ? 'הועבר מ' + relLabel(t.from) : '';
      if (tag) txt.appendChild(el('span', 'tag', tag));
      txt.onclick = function () { editing = t.id; render(); };
      li.appendChild(txt);

      var marks = el('div', 'marks');
      [['yes', 'done', 'עשיתי'], ['no', 'missed', 'לא עשיתי']].forEach(function (m) {
        var b = el('button', 'mk ' + m[0]); b.type = 'button';
        b.innerHTML = ICON[m[0]];
        b.setAttribute('aria-label', m[2]);
        b.setAttribute('aria-pressed', String(t.state === m[1]));
        b.onclick = function () { t.state = t.state === m[1] ? 'open' : m[1]; save(); render(); };
        marks.appendChild(b);
      });
      li.appendChild(marks);
      list.appendChild(li);
    });

    var empty = $('empty'); empty.hidden = tasks.length > 0; empty.textContent = '';
    if (!tasks.length) {
      empty.appendChild(el('strong', '', sel > today ? 'מה מתוכנן?' : sel === today ? 'מה עושים היום?' : 'יום ריק'));
      empty.appendChild(document.createTextNode(sel < today ? 'לא נרשמו משימות ביום הזה.' : 'כתוב משימה למעלה ולחץ ״הוסף״.'));
    }

    var foot = $('foot');
    foot.className = 'foot' + (storageOK ? '' : ' warn');
    foot.textContent = storageOK
      ? 'הכול נשמר אוטומטית במכשיר הזה. לחיצה על משימה פותחת עריכה ומחיקה.'
      : 'הדפדפן הזה חוסם שמירה, ולכן המשימות יימחקו ביציאה. נסה לפתוח בדפדפן רגיל, לא במצב פרטי.';
  }

  function removeTask(id) {
    var arr = tasksOf(sel);
    var i = arr.findIndex(function (x) { return x.id === id; });
    if (i < 0) return;
    lastDeleted = { day: sel, index: i, task: arr.splice(i, 1)[0] };
    editing = null; save(); render();
    $('toast').hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $('toast').hidden = true; lastDeleted = null; }, 5000);
  }

  $('undo').onclick = function () {
    if (!lastDeleted) return;
    var arr = db.days[lastDeleted.day] || (db.days[lastDeleted.day] = []);
    arr.splice(Math.min(lastDeleted.index, arr.length), 0, lastDeleted.task);
    lastDeleted = null; clearTimeout(toastTimer); $('toast').hidden = true;
    save(); render();
  };

  $('addForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var inp = $('newTask'), v = inp.value.trim();
    if (!v) { inp.focus(); return; }
    (db.days[sel] || (db.days[sel] = [])).push({ id: uid(), text: v, state: 'open' });
    inp.value = ''; save(); render(); inp.focus();
  });

  $('clearExamples').onclick = function () {
    Object.keys(db.days).forEach(function (k) {
      db.days[k] = db.days[k].filter(function (t) { return !t.example; });
    });
    save(); render(); $('newTask').focus();
  };

  $('carryYes').onclick = function () {
    var lo = leftovers(), arr = db.days[today] || (db.days[today] = []);
    lo.tasks.forEach(function (t) {
      t.carried = true;
      if (t.state === 'open') t.state = 'missed';
      arr.push({ id: uid(), text: t.text, state: 'open', from: lo.day });
    });
    save(); render();
  };
  $('carryNo').onclick = function () {
    leftovers().tasks.forEach(function (t) { t.carried = true; });
    save(); render();
  };

  // A new day started while the page was in the background.
  function checkDay() {
    var now = iso(new Date());
    if (now !== today) { today = now; sel = now; editing = null; render(); }
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) checkDay(); });
  window.addEventListener('focus', checkDay);

  render();
})();
</script>
</body>
</html>
