<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF2EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1917" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="היום שלי">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>היום שלי</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Karantina:wght@400;700&display=swap">
<style>
  /* Layout: one narrow column for the thumb. Two pages behind a switch:
     "every day" (a fixed routine, marked fresh each day) and "the week" (dated tasks for the next 7 days). */
  :root {
    --bg: #EDF2EE;
    --surface: #FBFDFB;
    --ink: #15302A;
    --muted: #5A6F68;
    --line: #D2DDD7;
    --done: #1C7556;
    --done-bg: #DCEFE5;
    --miss: #AE4C39;
    --miss-bg: #F6E1DA;
    --accent: #E2A12F;
    --on-accent: #15302A;
    --font-display: "Karantina", "Assistant", "Arial Hebrew", system-ui, sans-serif;
    --font-body: "Assistant", "Arial Hebrew", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1917; --surface: #162522; --ink: #E6EFEA; --muted: #8FA69E; --line: #2A3F3A;
      --done: #5CC79E; --done-bg: #173A2F; --miss: #E58B76; --miss-bg: #40231D;
      --accent: #F0B548; --on-accent: #0E1917; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1917; --surface: #162522; --ink: #E6EFEA; --muted: #8FA69E; --line: #2A3F3A;
    --done: #5CC79E; --done-bg: #173A2F; --miss: #E58B76; --miss-bg: #40231D;
    --accent: #F0B548; --on-accent: #0E1917; color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.45;
    -webkit-tap-highlight-color: transparent;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap {
    max-width: 540px;
    margin-inline: auto;
    padding-block: 16px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .view { display: flex; flex-direction: column; gap: 20px; }

  /* Page switch */
  .tabs {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
    background: var(--line); border-radius: 14px; padding: 4px;
  }
  .tabs button {
    border: 0; background: none; border-radius: 10px; min-height: 44px;
    font-weight: 700; color: var(--muted);
  }
  .tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); }

  /* Header */
  .head { display: flex; flex-direction: column; gap: 2px; }
  .rel {
    font-weight: 700; font-size: 14px; color: var(--muted);
    display: flex; align-items: center; gap: 8px; min-height: 20px;
  }
  .rel .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .dayname {
    font-family: var(--font-display); font-weight: 700;
    font-size: clamp(64px, 21vw, 96px); line-height: .9; margin: 0; letter-spacing: .01em;
  }
  .date { color: var(--muted); font-size: 16px; }

  /* Progress */
  .progress { display: flex; flex-direction: column; gap: 8px; }
  .segs { display: flex; gap: 4px; height: 10px; }
  .segs span { flex: 1; border-radius: 5px; background: var(--line); transition: background .25s; }
  .segs span.done { background: var(--done); }
  .segs span.missed { background: var(--miss); }
  .sum { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 15px; color: var(--muted); }
  .sum b { color: var(--ink); font-variant-numeric: tabular-nums; }

  /* Add forms */
  .add { display: flex; flex-wrap: wrap; gap: 8px; }
  .add input, .add select {
    height: 52px; padding: 0 14px; min-width: 0;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; font-size: 17px;
  }
  .add input[type="text"] { flex: 1 1 60%; }
  .add input::placeholder { color: var(--muted); }
  .add select { flex: 1 1 130px; }
  .add input[type="time"] { flex: 0 1 118px; }
  .add button {
    height: 52px; padding: 0 20px; border: 0; border-radius: 14px;
    background: var(--accent); color: var(--on-accent); font-weight: 700;
  }
  .add.week input[type="text"] { flex-basis: 100%; }

  .btn {
    min-height: 40px; padding: 0 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 15px;
  }
  .btn.quiet { background: none; border-color: transparent; color: var(--muted); }
  .btn.danger { color: var(--miss); }

  /* Lists */
  .group { display: flex; flex-direction: column; gap: 8px; }
  .group h2 {
    margin: 0; font-size: 15px; font-weight: 700; color: var(--muted);
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  }
  .group h2 .d { color: var(--ink); font-size: 18px; }
  .group h2 .free { font-weight: 400; margin-inline-start: auto; }
  .group.today h2 .d { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 3px; text-underline-offset: 4px; }
  .days { display: flex; flex-direction: column; gap: 22px; }

  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .task {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding-block: 6px; padding-inline: 6px 8px;
    transition: background .2s, border-color .2s;
  }
  .task .txt {
    flex: 1; min-width: 0; text-align: start; background: none; border: 0;
    padding: 10px; min-height: 48px; border-radius: 10px;
    overflow-wrap: anywhere; display: flex; flex-direction: column; justify-content: center; gap: 2px;
  }
  .task .tag { font-size: 13px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .marks { display: flex; gap: 6px; flex: none; }
  .mk {
    width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid var(--line);
    background: none; display: grid; place-items: center; color: var(--muted);
    transition: background .15s, color .15s, border-color .15s, transform .15s;
  }
  .mk svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .mk:active { transform: scale(.92); }
  .mk.yes[aria-pressed="true"] { background: var(--done); border-color: var(--done); color: var(--surface); }
  .mk.no[aria-pressed="true"] { background: var(--miss); border-color: var(--miss); color: var(--surface); }
  .task[data-state="done"] { background: var(--done-bg); border-color: transparent; }
  .task[data-state="done"] .txt .t { text-decoration: line-through; text-decoration-thickness: 1.5px; color: var(--muted); }
  .task[data-state="missed"] { background: var(--miss-bg); border-color: transparent; }
  .task[data-state="missed"] .tag { color: var(--miss); }

  .edit { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 8px; padding: 4px; }
  .edit input {
    flex: 1 1 100%; min-width: 0; height: 46px; padding: 0 12px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  }

  .empty { text-align: center; color: var(--muted); padding: 28px 12px; border: 1px dashed var(--line); border-radius: 16px; }
  .empty strong { display: block; color: var(--ink); font-family: var(--font-display); font-size: 34px; font-weight: 400; line-height: 1.1; }

  .foot { font-size: 13px; color: var(--muted); text-align: center; margin: 0; }
  .foot.warn { color: var(--miss); font-weight: 600; }

  .toast {
    position: fixed; inset-inline: 0; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    margin-inline: auto; width: max-content; max-width: calc(100% - 32px);
    display: flex; align-items: center; gap: 12px;
    background: var(--ink); color: var(--bg); padding-block: 8px; padding-inline: 16px 8px;
    border-radius: 14px; font-size: 15px;
  }
  .toast button { background: none; border: 0; color: var(--accent); font-weight: 700; min-height: 36px; padding: 0 10px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>
<body>
<div class="wrap" dir="rtl" lang="he">
  <div class="tabs" role="tablist" aria-label="עמודים">
    <button type="button" role="tab" id="tabDaily" aria-controls="viewDaily">כל יום</button>
    <button type="button" role="tab" id="tabWeek" aria-controls="viewWeek">השבוע</button>
  </div>

  <!-- Page 1: the routine that repeats every day -->
  <section class="view" id="viewDaily" role="tabpanel" aria-labelledby="tabDaily">
    <header class="head">
      <div class="rel"><span class="dot"></span>היום</div>
      <h1 class="dayname" id="dayname"></h1>
      <div class="date" id="date"></div>
    </header>

    <section class="progress" aria-live="polite">
      <div class="segs" id="segs"></div>
      <div class="sum" id="sum"></div>
    </section>

    <form class="add" id="addRoutine" autocomplete="off">
      <input id="newRoutine" type="text" placeholder="משימה לכל יום…" aria-label="משימה חדשה לכל יום" maxlength="200" enterkeyhint="done">
      <button type="submit">הוסף</button>
    </form>

    <ul class="list" id="routineList"></ul>
    <div class="empty" id="routineEmpty" hidden>
      <strong>מה עושים כל יום?</strong>
      כתוב כאן משימות שחוזרות כל יום, כמו לשתות מים או ללמוד 20 דקות. הסימונים מתאפסים כל בוקר.
    </div>

    <div class="group" id="todayExtra" hidden>
      <h2>רק היום, מתוך השבוע</h2>
      <ul class="list" id="todayList"></ul>
    </div>
  </section>

  <!-- Page 2: dated tasks for the next seven days -->
  <section class="view" id="viewWeek" role="tabpanel" aria-labelledby="tabWeek" hidden>
    <header class="head">
      <div class="rel">7 הימים הקרובים</div>
      <h1 class="dayname">השבוע</h1>
      <div class="date" id="range"></div>
    </header>

    <form class="add week" id="addDated" autocomplete="off">
      <input id="newDated" type="text" placeholder="למשל: תור לרופא…" aria-label="משימה חדשה לשבוע" maxlength="200" enterkeyhint="done">
      <select id="datedDay" aria-label="באיזה יום"></select>
      <input id="datedTime" type="time" aria-label="שעה, לא חובה">
      <button type="submit">הוסף</button>
    </form>

    <div class="days" id="days"></div>
  </section>

  <p class="foot" id="foot"></p>
</div>

<div class="toast" id="toast" dir="rtl" hidden>
  <span>המשימה נמחקה</span>
  <button type="button" id="undo">בטל</button>
</div>

<script>
(function () {
  document.documentElement.lang = 'he';
  document.documentElement.dir = 'rtl';

  var KEY = 'hayom-sheli.v2', OLD_KEY = 'hayom-sheli.v1';
  var storageOK = true;
  var $ = function (id) { return document.getElementById(id); };

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fromIso(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function shift(s, n) { var d = fromIso(s); d.setDate(d.getDate() + n); return iso(d); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function weekdayName(day) { return fromIso(day).toLocaleDateString('he-IL', { weekday: 'long' }); }
  function dayMonth(day) { return fromIso(day).toLocaleDateString('he-IL', { day: 'numeric', month: 'long' }); }

  // routine: tasks that repeat every day. marks: what was ticked on each date.
  // dated: one-off tasks kept under the date they belong to.
  function blank() { return { routine: [], marks: {}, dated: {} }; }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && d.routine && d.marks && d.dated) return d;
      }
      var old = localStorage.getItem(OLD_KEY);
      if (old) {
        // Tasks from the first version were tied to a date, so they become dated tasks.
        var o = JSON.parse(old), fresh = blank();
        Object.keys((o && o.days) || {}).forEach(function (k) {
          var keep = o.days[k].filter(function (t) { return !t.example; }).map(function (t) {
            return { id: t.id, text: t.text, time: '', state: t.state || 'open' };
          });
          if (keep.length) fresh.dated[k] = keep;
        });
        return fresh;
      }
    } catch (e) { storageOK = false; }
    return blank();
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(db)); storageOK = true; }
    catch (e) { storageOK = false; }
  }

  var today = iso(new Date());
  var view = location.hash === '#week' ? 'week' : 'daily';
  var editing = null;
  var undoFn = null, toastTimer = null;
  var db = load();

  // Old daily marks are only history; keep two months of them.
  (function prune() {
    var limit = shift(today, -60);
    Object.keys(db.marks).forEach(function (k) { if (k < limit) delete db.marks[k]; });
  })();

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  var ICON = {
    yes: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    no: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>'
  };

  function routineState(id) { return (db.marks[today] || {})[id] || 'open'; }
  function setRoutineState(id, s) {
    var m = db.marks[today] || (db.marks[today] = {});
    if (s === 'open') delete m[id]; else m[id] = s;
  }
  function datedOf(day) {
    return (db.dated[day] || []).slice().sort(function (a, b) {
      return (a.time || '99:99') < (b.time || '99:99') ? -1 : (a.time || '99:99') > (b.time || '99:99') ? 1 : 0;
    });
  }

  function showToast(restore) {
    undoFn = restore;
    $('toast').hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $('toast').hidden = true; undoFn = null; }, 5000);
  }
  $('undo').onclick = function () {
    if (!undoFn) return;
    undoFn(); undoFn = null; clearTimeout(toastTimer); $('toast').hidden = true;
    save(); render();
  };

  // One task row. o: {id, text, state, tag, onState(newState), onText(newText), onDelete()}
  function row(o) {
    var li = el('li', 'task'); li.dataset.state = o.state;
    if (editing === o.id) {
      var form = el('form', 'edit');
      var inp = el('input'); inp.type = 'text'; inp.value = o.text; inp.maxLength = 200;
      inp.id = 'edit-' + o.id; inp.setAttribute('aria-label', 'עריכת משימה');
      var ok = el('button', 'btn', 'שמור'); ok.type = 'submit';
      var del = el('button', 'btn danger', 'מחק'); del.type = 'button';
      var cancel = el('button', 'btn quiet', 'ביטול'); cancel.type = 'button';
      form.onsubmit = function (e) {
        e.preventDefault();
        var v = inp.value.trim();
        if (v) { o.onText(v); save(); }
        editing = null; render();
      };
      del.onclick = function () { editing = null; showToast(o.onDelete()); save(); render(); };
      cancel.onclick = function () { editing = null; render(); };
      form.appendChild(inp); form.appendChild(ok); form.appendChild(del); form.appendChild(cancel);
      li.appendChild(form);
      setTimeout(function () { inp.focus(); }, 0);
      return li;
    }
    var txt = el('button', 'txt'); txt.type = 'button';
    txt.setAttribute('aria-label', 'ערוך: ' + o.text);
    txt.appendChild(el('span', 't', o.text));
    var tag = [o.tag, o.state === 'missed' ? 'לא בוצע' : ''].filter(Boolean).join(' · ');
    if (tag) txt.appendChild(el('span', 'tag', tag));
    txt.onclick = function () { editing = o.id; render(); };
    li.appendChild(txt);

    var marks = el('div', 'marks');
    [['yes', 'done', 'עשיתי'], ['no', 'missed', 'לא עשיתי']].forEach(function (m) {
      var b = el('button', 'mk ' + m[0]); b.type = 'button';
      b.innerHTML = ICON[m[0]];
      b.setAttribute('aria-label', m[2]);
      b.setAttribute('aria-pressed', String(o.state === m[1]));
      b.onclick = function () { o.onState(o.state === m[1] ? 'open' : m[1]); save(); render(); };
      marks.appendChild(b);
    });
    li.appendChild(marks);
    return li;
  }

  function routineRow(t) {
    return row({
      id: t.id, text: t.text, state: routineState(t.id), tag: '',
      onState: function (s) { setRoutineState(t.id, s); },
      onText: function (v) { t.text = v; },
      onDelete: function () {
        var i = db.routine.indexOf(t);
        db.routine.splice(i, 1);
        return function () { db.routine.splice(Math.min(i, db.routine.length), 0, t); };
      }
    });
  }
  function datedRow(t, day) {
    return row({
      id: t.id, text: t.text, state: t.state || 'open', tag: t.time || '',
      onState: function (s) { t.state = s; },
      onText: function (v) { t.text = v; },
      onDelete: function () {
        var arr = db.dated[day], i = arr.indexOf(t);
        arr.splice(i, 1);
        if (!arr.length) delete db.dated[day];
        return function () {
          var a = db.dated[day] || (db.dated[day] = []);
          a.splice(Math.min(i, a.length), 0, t);
        };
      }
    });
  }

  function renderDaily() {
    $('dayname').textContent = weekdayName(today);
    $('date').textContent = fromIso(today).toLocaleDateString('he-IL', { day: 'numeric', month: 'long', year: 'numeric' });

    var todays = datedOf(today);
    var states = db.routine.map(function (t) { return routineState(t.id); })
      .concat(todays.map(function (t) { return t.state || 'open'; }));

    var segs = $('segs'); segs.textContent = '';
    if (!states.length) segs.appendChild(el('span'));
    states.forEach(function (s) { segs.appendChild(el('span', s === 'open' ? '' : s)); });

    var done = states.filter(function (s) { return s === 'done'; }).length;
    var missed = states.filter(function (s) { return s === 'missed'; }).length;
    var open = states.length - done - missed;
    var sum = $('sum'); sum.textContent = '';
    if (states.length) {
      var a = el('span'); a.appendChild(document.createTextNode('בוצעו '));
      a.appendChild(el('b', '', done + ' מתוך ' + states.length));
      sum.appendChild(a);
      sum.appendChild(el('span', '', done === states.length ? 'הכול בוצע. כל הכבוד!' :
        [open ? open + ' פתוחות' : '', missed ? missed + ' לא בוצעו' : ''].filter(Boolean).join(' · ')));
    } else {
      sum.appendChild(el('span', '', 'אין עדיין משימות'));
    }

    var list = $('routineList'); list.textContent = '';
    db.routine.forEach(function (t) { list.appendChild(routineRow(t)); });
    $('routineEmpty').hidden = db.routine.length > 0;

    $('todayExtra').hidden = todays.length === 0;
    var tl = $('todayList'); tl.textContent = '';
    todays.forEach(function (t) { tl.appendChild(datedRow(t, today)); });
  }

  function renderWeek() {
    $('range').textContent = dayMonth(today) + ' עד ' + dayMonth(shift(today, 6));

    var sel = $('datedDay'), chosen = sel.value;
    sel.textContent = '';
    for (var i = 0; i < 7; i++) {
      var day = shift(today, i), d = fromIso(day);
      var opt = el('option', '', (i === 0 ? 'היום' : i === 1 ? 'מחר' : weekdayName(day)) + ' · ' + d.getDate() + '.' + (d.getMonth() + 1));
      opt.value = day;
      sel.appendChild(opt);
    }
    if (chosen >= today && chosen <= shift(today, 6)) sel.value = chosen;

    var days = $('days'); days.textContent = '';
    for (var j = 0; j < 7; j++) {
      (function (day, n) {
        var tasks = datedOf(day);
        var g = el('section', 'group' + (n === 0 ? ' today' : ''));
        var h = el('h2');
        h.appendChild(el('span', 'd', n === 0 ? 'היום' : n === 1 ? 'מחר' : weekdayName(day)));
        h.appendChild(el('span', '', (n < 2 ? weekdayName(day) + ', ' : '') + dayMonth(day)));
        if (!tasks.length) h.appendChild(el('span', 'free', 'פנוי'));
        g.appendChild(h);
        if (tasks.length) {
          var ul = el('ul', 'list');
          tasks.forEach(function (t) { ul.appendChild(datedRow(t, day)); });
          g.appendChild(ul);
        }
        days.appendChild(g);
      })(shift(today, j), j);
    }
  }

  function render() {
    $('viewDaily').hidden = view !== 'daily';
    $('viewWeek').hidden = view !== 'week';
    $('tabDaily').setAttribute('aria-selected', String(view === 'daily'));
    $('tabWeek').setAttribute('aria-selected', String(view === 'week'));
    if (view === 'daily') renderDaily(); else renderWeek();

    var foot = $('foot');
    foot.className = 'foot' + (storageOK ? '' : ' warn');
    foot.textContent = !storageOK
      ? 'הדפדפן הזה חוסם שמירה, ולכן המשימות יימחקו ביציאה. נסה לפתוח בדפדפן רגיל, לא במצב פרטי.'
      : view === 'daily'
        ? 'הרשימה חוזרת כל יום והסימונים מתאפסים בבוקר. לחיצה על משימה פותחת עריכה ומחיקה.'
        : 'משימה שהגיע היום שלה מופיעה גם בעמוד ״כל יום״. הכול נשמר אוטומטית במכשיר הזה.';
  }

  function go(v) {
    view = v; editing = null;
    try { history.replaceState(null, '', v === 'week' ? '#week' : '#daily'); } catch (e) {}
    render();
    window.scrollTo(0, 0);
  }
  $('tabDaily').onclick = function () { go('daily'); };
  $('tabWeek').onclick = function () { go('week'); };

  $('addRoutine').addEventListener('submit', function (e) {
    e.preventDefault();
    var inp = $('newRoutine'), v = inp.value.trim();
    if (!v) { inp.focus(); return; }
    db.routine.push({ id: uid(), text: v });
    inp.value = ''; save(); render(); inp.focus();
  });

  $('addDated').addEventListener('submit', function (e) {
    e.preventDefault();
    var inp = $('newDated'), v = inp.value.trim();
    if (!v) { inp.focus(); return; }
    var day = $('datedDay').value || today;
    (db.dated[day] || (db.dated[day] = [])).push({ id: uid(), text: v, time: $('datedTime').value || '', state: 'open' });
    inp.value = ''; $('datedTime').value = '';
    save(); render(); inp.focus();
  });

  // A new day started while the page was in the background.
  function checkDay() {
    var now = iso(new Date());
    if (now !== today) { today = now; editing = null; render(); }
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) checkDay(); });
  window.addEventListener('focus', checkDay);

  render();
})();
</script>
</body>
</html>
